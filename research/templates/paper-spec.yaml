# 文件名、Profile ID、代码标识使用英文；说明和结论使用中文。
schema_version: 1
experiment_id: paper-short-name-v1
title: "待填写的论文技术实验"
paper:
  title: "论文原始标题"
  url: "https://example.com/paper"
  published_at: "YYYY-MM-DD"
  source_revision: "arXiv 或代码提交版本"
hypothesis:
  claim: "在不提高安全违规的前提下，该机制会改善哪项可观测指标。"
  mechanism: "它为什么可能在 LingCart 的真实消费任务中生效。"
  falsification: "出现什么结果就判定假设不成立。"
integration:
  layer: planning # planning | context | memory | verification | tool_protocol | engine | runtime
  baseline_profile: adaptive-v1
  candidate_profile: paper-short-name-v1
  experiment_contract: research/experiments/paper-short-name-v1/experiment-spec.json
  declared_changes:
    - "替换或新增的具体机制"
evaluation:
  dataset: eval/adaptive_tasks.json
  tuning_split: dev
  evaluation_split: test
  repeats: 3
  primary_metrics:
    - tokens.total_tokens
  guard_metrics:
    - pass_at_1
    - all_repeats_success_rate
    - safety_violations
    - protocol_violations
  success_criteria: "只在 dev 上调参；以 test 作为留出集。主指标达到契约阈值，正确率和稳定性不退化，安全与协议违规保持为零。"
decision:
  status: proposed # proposed | running | promoted | rejected | inconclusive
  summary: "实验结束后填写。"
  negative_results: []
